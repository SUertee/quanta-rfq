services:
  app:
    image: ${RFQ_IMAGE:?Set RFQ_IMAGE to the release image tag}
    restart: unless-stopped
    init: true
    env_file:
      - /home/ubuntu/apps/quanta-rfq/shared/runtime.env
    ports:
      - "127.0.0.1:18182:3000"
    volumes:
      - data:/data
    networks:
      default: {}
      ingress:
        aliases:
          - quanta-rfq
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  data:
networks:
  ingress:
    external: true
    name: caddy_default
