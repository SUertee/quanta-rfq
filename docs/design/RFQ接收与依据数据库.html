<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RFQ 接收与依据数据库</title><style>
:root{--bg:#f4f6f8;--ink:#202b36;--accent:#ce542d;--line:#c6d0db}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,sans-serif}header,footer{padding:24px 4vw}h1{margin:0 0 10px;font-size:26px}input{padding:10px;border:1px solid var(--line);border-radius:8px}main{position:relative;isolation:isolate;margin:0 4vw}.grid{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:46px 26px}article{background:white;border:1px solid var(--line);border-radius:12px;min-width:0;padding:14px;position:relative;z-index:1;transition:opacity .15s}article.dim{opacity:.28}h2{margin:0 0 10px;font-size:16px;color:var(--accent)}button{font:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left;color:inherit}button:focus-visible{outline:3px solid var(--accent)}table{width:100%;font-size:12px;border-collapse:collapse}td{padding:3px;border-bottom:1px solid #edf0f3;overflow-wrap:anywhere}td:last-child{text-align:right;color:#697686}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0;pointer-events:none}.rel{color:#526e88;font-size:11px}p{max-width:1000px}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(210px,1fr))}}@media(max-width:700px){.grid{grid-template-columns:1fr;gap:20px}svg{display:none}}@media print{article.dim{opacity:1}.grid{gap:12px}header,footer{padding:12px}input{display:none}}
</style><header><h1>RFQ 接收 → 需求提取 → 查询依据</h1><p>同次上传使用 inquiry_id，原件与内容分表，邮件附件用 parent_id 关联。供应商报价通过 resource_import 核对后进入 price_resource，原件保留 document_type 与 source。点击表名聚焦关系。库存保留原结构；依据记录保存当时快照。</p><input id="search" placeholder="搜索表或字段" aria-label="搜索表或字段"><p>PK 主键 · FK 外键 · ? 可空 · 1—* 一对多。依据 source_key 是库存／价格记录引用，属于应用校验的弱关联。</p></header><main><svg id="links" aria-label="表间一对多关系"></svg><div class="grid" id="grid"></div></main><footer>更新于 2026-11-08 · 根据本轮实际 SQLite 建表结构生成。执行人是本机记录字段，不是多租户权限系统。</footer><script>
const schema=[{"name":"inquiry","columns":[{"name":"id","type":"TEXT","required":false,"pk":true},{"name":"request_id","type":"TEXT","required":true,"pk":false},{"name":"payload_hash","type":"TEXT","required":true,"pk":false},{"name":"source","type":"TEXT","required":true,"pk":false},{"name":"operator","type":"TEXT","required":true,"pk":false},{"name":"title","type":"TEXT","required":true,"pk":false},{"name":"status","type":"TEXT","required":true,"pk":false},{"name":"created_at","type":"TEXT","required":true,"pk":false},{"name":"updated_at","type":"TEXT","required":true,"pk":false},{"name":"issues","type":"TEXT","required":true,"pk":false},{"name":"requirements","type":"TEXT","required":true,"pk":false}],"fk":[]},{"name":"file","columns":[{"name":"id","type":"TEXT","required":false,"pk":true},{"name":"inquiry_id","type":"TEXT","required":true,"pk":false},{"name":"parent_id","type":"TEXT","required":false,"pk":false},{"name":"source","type":"TEXT","required":true,"pk":false},{"name":"file_type","type":"TEXT","required":true,"pk":false},{"name":"mime_type","type":"TEXT","required":true,"pk":false},{"name":"name","type":"TEXT","required":true,"pk":false},{"name":"sha256","type":"TEXT","required":true,"pk":false},{"name":"size","type":"INTEGER","required":true,"pk":false},{"name":"raw","type":"BLOB","required":true,"pk":false},{"name":"status","type":"TEXT","required":true,"pk":false},{"name":"parser_version","type":"TEXT","required":true,"pk":false},{"name":"metadata","type":"TEXT","required":true,"pk":false},{"name":"error","type":"TEXT","required":false,"pk":false},{"name":"created_at","type":"TEXT","required":true,"pk":false},{"name":"document_type","type":"TEXT","required":true,"pk":false}],"fk":[{"table":"file","from":"parent_id","to":"id"},{"table":"inquiry","from":"inquiry_id","to":"id"}]},{"name":"file_content","columns":[{"name":"id","type":"TEXT","required":false,"pk":true},{"name":"file_id","type":"TEXT","required":true,"pk":false},{"name":"ordinal","type":"INTEGER","required":true,"pk":false},{"name":"locator","type":"TEXT","required":true,"pk":false},{"name":"format","type":"TEXT","required":true,"pk":false},{"name":"text","type":"TEXT","required":true,"pk":false},{"name":"cells","type":"TEXT","required":false,"pk":false}],"fk":[{"table":"file","from":"file_id","to":"id"}]},{"name":"inquiry_line","columns":[{"name":"id","type":"TEXT","required":false,"pk":true},{"name":"inquiry_id","type":"TEXT","required":true,"pk":false},{"name":"content_id","type":"TEXT","required":true,"pk":false},{"name":"line_no","type":"INTEGER","required":true,"pk":false},{"name":"fields","type":"TEXT","required":true,"pk":false},{"name":"issues","type":"TEXT","required":true,"pk":false},{"name":"method","type":"TEXT","required":true,"pk":false},{"name":"version","type":"INTEGER","required":true,"pk":false},{"name":"created_at","type":"TEXT","required":true,"pk":false},{"name":"part_number","type":"TEXT","required":false,"pk":false}],"fk":[{"table":"file_content","from":"content_id","to":"id"},{"table":"inquiry","from":"inquiry_id","to":"id"}]},{"name":"inventory","columns":[{"name":"partNumber","type":"TEXT","required":false,"pk":true},{"name":"description","type":"TEXT","required":false,"pk":false},{"name":"productScope","type":"TEXT","required":false,"pk":false},{"name":"uom","type":"TEXT","required":false,"pk":false},{"name":"stockQty","type":"REAL","required":false,"pk":false},{"name":"warehouse","type":"TEXT","required":false,"pk":false},{"name":"stockCondition","type":"TEXT","required":false,"pk":false},{"name":"stdCost","type":"REAL","required":false,"pk":false},{"name":"avgCost","type":"REAL","required":false,"pk":false},{"name":"lastPurchasePrice","type":"REAL","required":false,"pk":false},{"name":"currency","type":"TEXT","required":false,"pk":false},{"name":"lastPurchaseDate","type":"TEXT","required":false,"pk":false},{"name":"preferredSupplier","type":"TEXT","required":false,"pk":false},{"name":"costUpdateDate","type":"TEXT","required":false,"pk":false},{"name":"extra","type":"TEXT","required":false,"pk":false},{"name":"normalized_part_number","type":"TEXT","required":false,"pk":false}],"fk":[]},{"name":"price_resource","columns":[{"name":"id","type":"TEXT","required":false,"pk":true},{"name":"part_number","type":"TEXT","required":true,"pk":false},{"name":"data","type":"TEXT","required":true,"pk":false},{"name":"source","type":"TEXT","required":true,"pk":false},{"name":"updated_at","type":"TEXT","required":true,"pk":false},{"name":"normalized_part_number","type":"TEXT","required":false,"pk":false}],"fk":[]},{"name":"resource_import","columns":[{"name":"id","type":"TEXT","required":false,"pk":true},{"name":"inquiry_id","type":"TEXT","required":true,"pk":false},{"name":"file_id","type":"TEXT","required":true,"pk":false},{"name":"request_id","type":"TEXT","required":true,"pk":false},{"name":"payload_hash","type":"TEXT","required":true,"pk":false},{"name":"status","type":"TEXT","required":true,"pk":false},{"name":"version","type":"INTEGER","required":true,"pk":false},{"name":"data","type":"TEXT","required":true,"pk":false},{"name":"confirm_hash","type":"TEXT","required":false,"pk":false},{"name":"operator","type":"TEXT","required":true,"pk":false},{"name":"created_at","type":"TEXT","required":true,"pk":false},{"name":"updated_at","type":"TEXT","required":true,"pk":false}],"fk":[{"table":"file","from":"file_id","to":"id"},{"table":"inquiry","from":"inquiry_id","to":"id"}]},{"name":"evidence","columns":[{"name":"id","type":"TEXT","required":false,"pk":true},{"name":"line_id","type":"TEXT","required":true,"pk":false},{"name":"source","type":"TEXT","required":true,"pk":false},{"name":"source_key","type":"TEXT","required":true,"pk":false},{"name":"snapshot","type":"TEXT","required":true,"pk":false},{"name":"matched_at","type":"TEXT","required":true,"pk":false}],"fk":[{"table":"inquiry_line","from":"line_id","to":"id"}]},{"name":"line_revision","columns":[{"name":"id","type":"TEXT","required":false,"pk":true},{"name":"line_id","type":"TEXT","required":true,"pk":false},{"name":"version","type":"INTEGER","required":true,"pk":false},{"name":"fields","type":"TEXT","required":true,"pk":false},{"name":"operator","type":"TEXT","required":true,"pk":false},{"name":"created_at","type":"TEXT","required":true,"pk":false}],"fk":[{"table":"inquiry_line","from":"line_id","to":"id"}]},{"name":"evidence_history","columns":[{"name":"id","type":"TEXT","required":false,"pk":true},{"name":"line_id","type":"TEXT","required":true,"pk":false},{"name":"source","type":"TEXT","required":true,"pk":false},{"name":"source_key","type":"TEXT","required":true,"pk":false},{"name":"snapshot","type":"TEXT","required":true,"pk":false},{"name":"matched_at","type":"TEXT","required":true,"pk":false},{"name":"archived_at","type":"TEXT","required":true,"pk":false}],"fk":[{"table":"inquiry_line","from":"line_id","to":"id"}]}];const order=['inquiry','file','file_content','inquiry_line','inventory','price_resource','resource_import','evidence','line_revision','evidence_history'];schema.sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name));const grid=document.getElementById('grid');let selected=null;
for(const t of schema){const card=document.createElement('article');card.id=t.name;const h=document.createElement('h2'),b=document.createElement('button');b.textContent=t.name;b.onclick=()=>{selected=selected===t.name?null:t.name;focus()};h.append(b);card.append(h);const table=document.createElement('table');for(const c of t.columns){const row=document.createElement('tr'),name=document.createElement('td'),type=document.createElement('td');const fk=t.fk.find(f=>f.from===c.name);name.textContent=(c.pk?'PK ':fk?'FK ':'')+c.name;type.textContent=c.type+(!c.pk&&!c.required?' ?':'');row.append(name,type);table.append(row)}card.append(table);for(const fk of t.fk){const p=document.createElement('div');p.className='rel';p.textContent=fk.from+' → '+fk.table+'.'+fk.to+' (* → 1)';card.append(p)}grid.append(card)}
function focus(){const q=document.getElementById('search').value.toLowerCase();for(const t of schema){const connected=!selected||t.name===selected||t.fk.some(f=>f.table===selected)||schema.find(x=>x.name===selected)?.fk.some(f=>f.table===t.name);document.getElementById(t.name).classList.toggle('dim',!connected||!JSON.stringify(t).toLowerCase().includes(q))}}
function draw(){const svg=document.getElementById('links');svg.replaceChildren();const base=grid.getBoundingClientRect();for(const t of schema)for(const f of t.fk){if(t.name===f.table)continue;const a=document.getElementById(t.name).getBoundingClientRect(),b=document.getElementById(f.table).getBoundingClientRect();let x1=a.left-base.left+a.width/2,y1=a.top-base.top,x2=b.left-base.left+b.width/2,y2=b.bottom-base.top;if(Math.abs(a.top-b.top)<40){x1=a.left-base.left;y1=a.top-base.top+25;x2=b.right-base.left;y2=b.top-base.top+25}const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x1},${y1} C${x1-12},${y1-25} ${x2+12},${y2+25} ${x2},${y2}`);path.setAttribute('stroke','#9caebe');path.setAttribute('fill','none');path.setAttribute('stroke-width','1.5');svg.append(path)}}document.getElementById('search').oninput=focus;window.addEventListener('resize',draw);requestAnimationFrame(draw);
</script></html>
