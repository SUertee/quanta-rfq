<script id="landing-entry-scroll">
// Every entry starts at the hero, even when an old shared URL contains a fragment.
(()=>{
  history.scrollRestoration='manual';
  const reset=()=>{
    if(location.hash)history.replaceState(history.state,'',location.pathname+location.search);
    window.scrollTo({top:0,left:0,behavior:'instant'});
  };
  reset();
  addEventListener('pageshow',()=>{reset();requestAnimationFrame(reset);});
  addEventListener('hashchange',reset);
  // In-page navigation scrolls without leaving a fragment to reopen midway next time.
  document.addEventListener('click',event=>{
    if(event.defaultPrevented||event.button>0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    const anchor=event.target?.closest?.('a[href^="#"]');
    if(!anchor)return;
    let id;try{id=decodeURIComponent(anchor.getAttribute('href').slice(1));}catch{return;}
    const section=document.getElementById(id);if(!section)return;
    event.preventDefault();
    section.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});
  });
})();
</script>

let start;function frame(now){start??=now;const elapsed=now-start;paint(h1,clamp(elapsed/1250),.35,navy,blue,white);if(elapsed<1300){const s=smooth((elapsed-250)/1050);cur=[-.3+.6*s,.3+.04*s,.1+.12*s];onScroll()}else cur=cur.map((v,i)=>v+(target[i]-v)*.12);draw(cur[0]+Math.sin(now*.00033+1.3)*.02,cur[1]+Math.sin(now*.0005)*.015,cur[2]);requestAnimationFrame(frame)}
