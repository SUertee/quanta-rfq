<script id="landing-entry-scroll">
// Every entry starts at the hero, even when an old shared URL contains a fragment.
(()=>{
  history.scrollRestoration='manual';
  const reset=()=>{
    if(location.hash)history.replaceState(history.state,'',location.pathname+location.search);
    window.scrollTo({top:0,left:0,behavior:'instant'});
  };
  reset();
  addEventListener('pageshow',()=>{reset();requestAnimationFrame(reset);});
  addEventListener('hashchange',reset);
  // In-page navigation scrolls without leaving a fragment to reopen midway next time.
  document.addEventListener('click',event=>{
    if(event.defaultPrevented||event.button>0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    const anchor=event.target?.closest?.('a[href^="#"]');
    if(!anchor)return;
    let id;try{id=decodeURIComponent(anchor.getAttribute('href').slice(1));}catch{return;}
    const section=document.getElementById(id);if(!section)return;
    event.preventDefault();
    section.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});
  });
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* finesse · register=brand · A=sky-cyan+navy · B=400/500 · C=bowl-hero+scroll-statement+dark-split · D=canvas+scroll-reveal · E=Halden-reference · SOUL=7 SPECTACLE=7 DENSITY=3 */
:root{--ink:#0b1d3a;--ink-2:#1d2f4f;--accent:#5b7cf0;--dot:#2fe0d0;--panel:#0e1f3d;--panel-line:rgba(255,255,255,.12);--gut:clamp(20px,5.7vw,82px);--ease:cubic-bezier(.22,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#fff;overflow-x:clip}body{font-family:'Inter Tight','PingFang SC',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,a{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:5px}main{position:relative;z-index:1}.atmo{position:fixed;inset:0;z-index:0;pointer-events:none;background:#fff}.atmo canvas{width:100%;height:100%;display:block}
.nav{position:fixed;z-index:50;top:20px;left:var(--gut);right:var(--gut);height:60px;border-radius:999px;background:#fff;display:flex;align-items:center;padding:0 10px 0 22px;box-shadow:0 1px 0 rgba(11,29,58,.04),0 10px 30px -18px rgba(11,29,58,.25);animation:navin .9s var(--ease) .15s both}.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:500;letter-spacing:-.02em}.brand svg{width:22px;height:22px}.links{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:31px;font-size:14px;font-weight:500;letter-spacing:-.005em}.links a{opacity:.92;white-space:nowrap;transition:opacity .2s}.links a:hover{opacity:.55}.nav-right{margin-left:auto;display:flex;align-items:center}.login{font-size:14px;font-weight:500;padding:12px 14px;white-space:nowrap}.navcta{width:42px;height:42px;overflow:hidden;border-radius:999px;margin-left:-42px;transform:scale(0);transform-origin:100% 50%;transition:transform .35s var(--ease),width .65s var(--ease) .22s,margin .35s var(--ease)}.navcta .btn{width:142px}.navcta .lbl{opacity:0;transition:opacity .4s .45s}.nav.on .navcta{width:142px;margin-left:16px;transform:scale(1)}.nav.on .lbl{opacity:1}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 46px 0 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}.dot{position:absolute;right:16px;top:50%;width:10px;height:10px;transform:translateY(-50%);border-radius:50%;background:var(--dot);box-shadow:0 0 10px rgba(47,224,208,.7);display:grid;place-items:center;transition:width .45s var(--ease),height .45s var(--ease),right .45s var(--ease),box-shadow .45s}.dot svg{width:12px;height:12px;opacity:0;transform:translateX(-4px);stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s .05s,transform .3s .05s}.btn.lg{height:62px;padding:0 62px 0 28px;font-size:17px}.btn.lg .dot{width:14px;height:14px;right:24px}.btn.lg .dot svg{width:16px;height:16px}@media(hover:hover) and (pointer:fine){.btn:hover .dot{width:32px;height:32px;right:5px;box-shadow:none}.btn:hover .dot svg{opacity:1;transform:none}.btn.lg:hover .dot{width:48px;height:48px;right:7px}}
.hero{position:relative;height:100vh;min-height:640px}h1{position:absolute;top:21.5vh;left:var(--gut);font-weight:400;font-size:clamp(34px,4.65vw,70px);line-height:1.15;letter-spacing:-.035em;white-space:nowrap}.hl{color:var(--accent)}.trust{position:absolute;top:58vh;left:var(--gut);font-size:clamp(15px,1.28vw,19px);letter-spacing:-.015em;color:var(--ink-2)}.hero>.btn{position:absolute;bottom:7.5vh;left:var(--gut)}.logos{position:absolute;right:0;width:50%;top:55vh;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.logo-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#3e4d68;font-size:13px;font-weight:500;letter-spacing:.04em;border-left:1px solid rgba(11,29,58,.07)}.logo-cell:nth-child(n+5){border-top:1px solid rgba(11,29,58,.06)}.logo-cell svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}.fade-up{animation:fu .9s var(--ease) both;animation-delay:var(--d,1.15s)}.word{display:inline-block;white-space:nowrap}#stmt .word{display:inline;white-space:normal}.letter{display:inline-block}
.statement{position:relative;height:306vh;margin-top:-31vh;pointer-events:none}.pin{position:sticky;top:0;height:100vh}#stmt{position:absolute;top:41.5vh;left:0;right:0;text-align:center;font-weight:400;font-size:clamp(20px,2.8vw,42px);line-height:1.3;letter-spacing:-.03em;white-space:nowrap;will-change:transform}
.split{position:relative;z-index:2;background:var(--panel);color:#fff;min-height:100vh;display:grid;grid-template-columns:58.3% 41.7%}.split .l{padding-left:var(--gut);position:relative;padding-bottom:8vh}.split .l:before{content:'';position:absolute;left:var(--gut);top:0;bottom:0;width:1px;background:var(--panel-line)}h2{font-weight:400;font-size:clamp(32px,3.15vw,48px);line-height:1.15;letter-spacing:-.03em;padding:21vh 0 0 6.2vw}#row{margin-top:6.4vh;border-top:1px solid var(--panel-line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;padding:3vh 6vw 0 6.2vw;transition:opacity .9s var(--ease),transform .9s var(--ease)}#row h3{font-weight:400;font-size:clamp(17px,1.4vw,21px)}#row p{font-size:clamp(13px,1.1vw,16px);line-height:1.6;color:rgba(255,255,255,.5);max-width:20em}#row strong{color:#fff;font-weight:500}#row .btn{margin-top:24px;border:1px solid var(--panel-line);background:transparent}.split .r{position:relative;overflow:hidden;background:#163650}.split img{position:absolute;width:100%;height:100%;object-fit:cover;transform-origin:50% 60%}footer{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:28px var(--gut);background:var(--panel);color:rgba(255,255,255,.6);font-size:12px;border-top:1px solid var(--panel-line)}footer a{color:#fff;white-space:nowrap}
@keyframes navin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:820px){.links{display:none}.nav{height:54px;top:12px;padding-left:18px}.nav.on .navcta{margin-left:8px}.login{padding-inline:6px;font-size:13px}.navcta .btn{font-size:12px}.brand{font-size:16px}h1{top:17vh;font-size:7.4vw;white-space:normal;right:var(--gut);line-height:1.2}.trust{top:44vh;font-size:14px}.logos{width:100%;top:50vh;bottom:18vh}.logo-cell{gap:10px;font-size:11px}.logo-cell svg{width:20px;height:20px}.hero>.btn{bottom:6vh}.btn.lg{height:54px;font-size:15px}.btn.lg .dot{width:12px;height:12px}#stmt{font-size:23px;white-space:normal;max-width:15em;margin:auto;line-height:1.4;padding-inline:10px}#stmt br{display:none}.split{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 70vh}.split h2{padding:16vh 6vw 0;font-size:32px}.split .l{padding-left:var(--gut);padding-bottom:0}#row{grid-template-columns:minmax(0,1fr);padding:3vh 6vw 6vh}footer{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.letter{opacity:1!important;filter:none!important}#stmt{transform:none!important}#row{opacity:1!important;transform:none!important}.split img{transform:none!important}}
.nav .login{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff}
.nav .quanta-wordmark{display:block;width:126px;height:40px;object-fit:contain}.footer-brand{display:flex;align-items:center;gap:20px}.footer-brand img{display:block;object-fit:contain}@media(max-width:600px){.footer-brand{flex-direction:column;align-items:flex-start;gap:10px}}
</style>
